[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "toy-ai-workbench-pr-gate"
version = "0.1.0"
description = "Toy package for AI Workbench PR gate proof."
readme = "README.md"
requires-python = ">=3.11"

[tool.hatch.build.targets.wheel]
packages = ["src/toycalc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q -p no:cacheprovider"
